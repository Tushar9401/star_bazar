<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header .store-name {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header .welcome {
            font-size: 16px;
            opacity: 0.85;
        }

        /* ── ITEM LIST ── */
        .cart-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }
        .cart-table thead tr {
            background: #1a73e8;
            color: white;
            font-size: 15px;
        }
        .cart-table thead th {
            padding: 12px 16px;
            text-align: left;
        }
        .cart-table thead th:last-child,
        .cart-table thead th:nth-child(2) {
            text-align: right;
        }
        .cart-table tbody tr {
            border-bottom: 1px solid #dde3f0;
            transition: background 0.2s;
        }
        .cart-table tbody tr:nth-child(even) {
            background: #e8eeff;
        }
        .cart-table tbody tr:hover {
            background: #d0dcff;
        }
        .cart-table tbody td {
            padding: 14px 16px;
            font-size: 16px;
            color: #222;
        }
        .cart-table tbody td:nth-child(2),
        .cart-table tbody td:last-child {
            text-align: right;
            font-weight: 600;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            font-size: 20px;
            margin-top: 80px;
        }

        /* ── TOTALS ── */
        .totals-bar {
            background: white;
            border-top: 2px solid #dde3f0;
            padding: 20px 32px;
        }
        .totals-bar .row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: #444;
            margin-bottom: 8px;
        }
        .totals-bar .row.grand {
            font-size: 28px;
            font-weight: 700;
            color: #1a73e8;
            margin-top: 10px;
            border-top: 1px solid #dde3f0;
            padding-top: 10px;
        }

        /* ── FOOTER ── */
        .footer {
            background: #1a73e8;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="store-name">⭐ Star Bazar</div>
        <div class="welcome">Welcome! Please review your items.</div>
    </div>

    <div class="cart-wrapper">
        <table class="cart-table" id="cart-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align:left">Item</th>
                    <th>Qty</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="cart-body">
                <tr>
                    <td colspan="4" class="empty-msg">Waiting for items...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="totals-bar">
        <div class="row">
            <span>Net Total</span>
            <span id="net-total">$ 0.00</span>
        </div>
        <div class="row">
            <span id="tax-label">Tax</span>
            <span id="tax-amount">$ 0.00</span>
        </div>
        <div class="row grand">
            <span>Grand Total</span>
            <span id="grand-total">$ 0.00</span>
        </div>
    </div>

    <div class="footer">
        Thank you for shopping with us!
    </div>

    <script>
    // ✅ Listen via BroadcastChannel (for updates after page is loaded)
    const channel = new BroadcastChannel("pos_customer_display");
    channel.onmessage = function (event) {
        handleMessage(event.data);
    };

    // ✅ Listen via postMessage (for the very first load)
    window.addEventListener("message", function (event) {
        // Only accept messages from same origin
        if (event.origin !== window.location.origin) return;
        handleMessage(event.data);
    });

    function handleMessage(data) {
        if (!data) return;
        if (data.type === "cart_update") renderCart(data);
        if (data.type === "cart_clear")  clearCart();
    }

    function renderCart(data) {
        const tbody = document.getElementById("cart-body");
        const items = data.items || [];

        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">No items yet...</td></tr>`;
        } else {
            tbody.innerHTML = items.map((item, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${item.item_name || item.item_code}</td>
                    <td style="text-align:right">${item.qty}</td>
                    <td style="text-align:right">$ ${fmtAmt(item.amount)}</td>
                </tr>
            `).join("");
        }

        document.getElementById("net-total").textContent   = "$ " + fmtAmt(data.net_total);
        document.getElementById("tax-amount").textContent  = "$ " + fmtAmt(data.tax_total);
        document.getElementById("tax-label").textContent   = data.tax_label || "Tax";
        document.getElementById("grand-total").textContent = "$ " + fmtAmt(data.grand_total);
    }

    function clearCart() {
        document.getElementById("cart-body").innerHTML =
            `<tr><td colspan="4" class="empty-msg">Thank you! Have a great day 😊</td></tr>`;
        document.getElementById("net-total").textContent   = "$ 0.00";
        document.getElementById("tax-amount").textContent  = "$ 0.00";
        document.getElementById("grand-total").textContent = "$ 0.00";
    }

    function fmtAmt(val) {
        return parseFloat(val || 0).toFixed(2);
    }

    // ✅ Tell the POS we are ready so it can send current cart immediately
    window.addEventListener("load", function () {
        if (window.opener) {
            window.opener.postMessage({ type: "customer_display_ready" }, window.location.origin);
        }
    });
</script>

</body>
</html>
